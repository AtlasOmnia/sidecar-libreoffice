name: atlas-sidecar-libreoffice
title: "Sidecar for LibreOffice"
repo: https://github.com/AtlasOmnia/sidecar-libreoffice
subdir: plugin
docs_url: https://github.com/AtlasOmnia/sidecar-libreoffice/tree/v0.5.0#readme  # the catalog PR uses the pinned SHA here
sha: TODO  # template only: the catalog PR pins the release commit's full 40-character SHA
version: "0.5.0"
description: "Sidecar for LibreOffice by Atlas Omnia — your Hermes agent works on the Calc, Writer and Impress documents you already have open in LibreOffice, and you can chat with it in the Sidecar window: the Sidecar for Excel chat, opened beside LibreOffice from its sidebar. 55 tools read and edit the open documents the agent names by document_id; supported edits are one named undo step and Hermes can undo its own changes. Setup: install the plugin, then build the companion LibreOffice extension (.oxt) from this repository at tag v0.5.0 (Hermes does not install it) and add it in LibreOffice's Extension Manager (Tools > Extensions), pair with Tools > Copy Sidecar pairing token and save the token as LIBREOFFICE_LIVE_BRIDGE_TOKEN; the optional sidebar chat is off by default and also needs the Hermes API server with API_SERVER_KEY and the plugin setting chat_port (8661). Disclosure — the extension runs a token-checked plain-HTTP listener on 127.0.0.1:8660 inside LibreOffice while LibreOffice runs and stores its pairing token owner-only in the LibreOffice profile; Hermes keeps a copy in its secret store. The plugin's chat endpoint is off by default and is not started unless the user sets chat_port (8661); then, inside the Hermes gateway process (plugins.isolation: in_process, the default), it listens on 127.0.0.1:8661 from when the gateway loads the plugin until the plugin is unloaded or Hermes exits. It also serves the Sidecar web page (static files shipped in the plugin, checked against a hash list on every request; marked and DOMPurify vendored, nothing fetched at runtime) and a small API used only by that page, and forwards the page's chats to the user's Hermes API server on loopback (setting api_server_port, default 8642) with API_SERVER_KEY, read through Hermes's profile-scoped secret lookup, kept in memory, never logged or sent to LibreOffice or the browser. Its routes are separated by caller: the 0.5.0 extension proves it knows the pairing token with an HMAC challenge-response and never sends the token there; the page authenticates with a one-time launch code (30 seconds, single use, handed to the browser through an owner-only file, never on a process command line) exchanged for a session token kept in page memory only, with no cookies; the legacy /chat and /health routes keep accepting the bearer pairing token from 0.4.0 extensions until 0.6.0. When the user clicks Open Sidecar, and only then, the LibreOffice extension starts a browser: on macOS an installed Chrome, Edge, Brave or Chromium as a separate process in app mode with its own profile in the user cache folder (empty at first, about 60 MB once used), asked to quit when LibreOffice quits; otherwise, and always on Windows in 0.5.0, the default browser as a normal tab, where the user's browser extensions can read the page and the browser history keeps the spent one-time link. It never reads the user's browser profiles, cookies or keychain. Besides that browser the extension starts only these programs, each with an argument list and a cleaned environment: on macOS /usr/bin/osascript, to bring an open Sidecar window to the front, and /usr/bin/open, to open a normal tab in your default browser; on Windows the tab is opened through the file association for .html files, which starts your default browser. It runs no shell. The plugin starts no process. Each Sidecar window costs browser memory (about 310 MB for the dedicated Chrome instance with one window on macOS, measured once). Replies are rendered as sanitized Markdown; links are copy-only and images are not loaded; closing or reloading the window stops a reply in progress. Both listeners authenticate the client only, so a local process that holds a port while the real listener is down could receive the pairing token (8660, or 8661 from a 0.4.0 extension), the API key, or the later messages of an open Sidecar window. A Sidecar chat is the user's full Hermes agent with its tools limited by a pre_tool_call hook to this plugin's tools plus skill_view, skills_list, tool_search and tool_describe; the hook does not cover external-agent model runtimes, which are unsupported for the sidebar chat. calc_get_overview lists the titles and file locations of all open LibreOffice documents, and there is no per-edit approval. There is no upload step, but document excerpts and chat go through Hermes to its configured model. The extension and plugin make no third-party network calls themselves (LibreOffice may when it evaluates document content, and a browser started for the window may contact its vendor) and have no telemetry or self-updater. Sidecar is developed by Atlas Omnia. It is not affiliated with or endorsed by The Document Foundation, Microsoft or Nous Research. LibreOffice is a trademark of The Document Foundation."
maintainer: AtlasOmnia
tier: community
category: tools
requires_hermes: ">=0.23.1"
readme: true
platforms: [macos, windows]  # Sidecar window: app window on macOS with Chrome/Edge/Brave/Chromium, else a default-browser tab; Windows 0.5.0: default-browser tab. Linux untested; the window is not supported there
known_issues:
  - "Hermes installs only the plugin. The companion LibreOffice extension (.oxt) is built from the repository at tag v0.5.0 (the README gives its SHA-256, the same on macOS and Windows) and added by hand in LibreOffice's Extension Manager (LibreOffice with Python-UNO required). Upgrading from 0.4.0: remove nothing; update the plugin and restart the gateway, then add the 0.5.0 .oxt, which has the same identifier and replaces 0.4.0; the pairing token and settings stay, and the sidebar chat stays off unless it was on. A 0.5.0 extension needs the 0.5.0 plugin; a 0.4.0 extension keeps working with it until 0.6.0. Older than 0.4.0: remove the earlier extension first (it has another identifier and both would bind port 8660), and after replacing a plugin build before 0.4.0 (libreoffice-live) restart the Hermes gateway once."
  - "The Sidecar window is new in 0.5.0 and has not yet run with a real gateway and model. Its 0.5.0 tests: on macOS 27.2.1 with LibreOffice 26.8.2.2 and Chrome 158, the release .oxt in a disposable profile against the plugin's chat endpoint with a fake Runs API (open beside Calc, one formatted reply, Stop, New chat, a second click raising the same window, quit closing the browser), headless Chrome 158 checks against the real plugin, and on Windows 11 the launcher code without LibreOffice opening the page as a Firefox 160 tab; Edge, Brave, LibreOffice on Windows and 2x or multi-display placement were not run. The document tools, the bridge on port 8660 and the tool fence are unchanged from 0.4.0, whose native tests ran on LibreOffice 26.8.2.2 on macOS 27.2 (the 0.4.0 .oxt in a disposable profile, and an earlier compressed build of the same extension files in an everyday install) and on Windows 11 with LibreOffice 26.8.3.1 (a compressed build of the same extension files installed through the Extension Manager dialog, shown in the sidebar and passing the plugin-handler matrix, driven by synthetic window messages on a locked console; the 0.4.0 .oxt built there with the same SHA-256). Hermes itself has not run the plugin on Windows. Linux is untested. Hermes versions: tested with Hermes Agent 0.23.1 (installed: CLI, plugin manager, one gateway chat with the 0.4.0 native panel); on the v0.23.3 source, without a gateway or model, plugin validation passed with no warnings and the plugin-manager probe gave the same results."
  - "The sidebar chat is off by default (chat_port 0); the plugin starts no chat endpoint unless the user sets chat_port, and with it off the extension starts no browser. Its tool fence is a pre_tool_call hook, not a Hermes-enforced limit. External-agent runtimes are unsupported for restricted sidebar chat. Keep chat_port: 0 when using one. The dedicated-profile recipe restricts Hermes tools only; it does not disable an external runtime's built-in tools. Use a Hermes-managed model/tool loop for that recipe, explicitly configure it in the dedicated profile, disable MCP and other toolsets there, and verify the resulting configuration before enabling sidebar forwarding. External agents such as codex_app_server run their own tools, which never reach Hermes hooks. Another gap (an older non-default API execution mode after compaction) is in SECURITY.md."
  - "Accepted limitation, only after the user turns the sidebar chat on: when the plugin is disabled or reloaded, Hermes removes its tool restriction (the pre_tool_call hook) as soon as the unload callback returns, possibly before the plugin's 10-second stop budget has run out; a sidebar chat that was not confirmed stopped keeps running without the restriction, with the user's full Hermes tools. This is accepted and disclosed for 0.4.0 and unchanged in 0.5.0; the fix needs a Hermes-side per-run tool restriction. Unload first asks the runs whose IDs it knows to stop (a run whose creation was never answered has none). A gateway shutdown or restart does not unload plugins first: Hermes drains, then interrupts, its API-server runs, and they end with the gateway process."
  - "Sidecar window platforms: on Windows 0.5.0 it is a normal tab in the default browser (no app window), and on a Mac without Chrome, Edge, Brave or Chromium too; there the user's browser extensions can read the page and the history keeps the spent one-time link. Linux is not supported for the window. On managed computers browser policies (forced sign-in, URL blocklists, proxies, administrator-installed extensions) can keep the window from connecting, and Sidecar does not try another browser. Closing or reloading the window stops a reply in progress; if LibreOffice crashes the window stays open; on macOS the dedicated browser's Dock icon can stay until LibreOffice quits."
  - "When turned on, the sidebar chat starts only with plugins.isolation: in_process and needs the Hermes API server enabled with API_SERVER_KEY; in a gateway serving several profiles, the first profile to bind a given chat port gets it. A run whose status can no longer be read is asked to stop and stays tracked until it is seen to settle; run creation uses an Idempotency-Key. The Sidecar window cannot answer approvals; a run waiting for one ends at the 600-second deadline or when the user presses Stop. For 0.4.0 the chat endpoint was checked through Hermes 0.23.1's plugin manager against fake Runs API servers, and an earlier build of the plugin (chat on by default) in one real chat through a 0.23.1 gateway with a model on macOS (read, edit, undo, a terminal command refused by the fence); stopping a run on unload, recovery from a lost Runs API answer and a chat across a compaction were not exercised with a gateway."
  - "calc_activate_sheet and calc_recalculate are not undoable; some Impress undo restores text without its mixed formatting; protection does not block the bridge's own writes; shape colours set by impress_add_shape are saved to .pptx as theme colours."
  - "Slide reorder is not available (LibreOffice exposes no identity-preserving API) and pivot tables are not implemented. In 0.5.0 the Sidecar window shows a reply when it is finished (no word-by-word streaming or live tool rows), and a reconnected window does not show earlier messages."
